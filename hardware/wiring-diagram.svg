<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">LoRa warehouse tracking prototype wiring boundaries</title>
  <desc id="desc">Source-derived tag, gateway and service overview. This is not a PCB schematic and the current commit has not been hardware retested.</desc>
  <style>
    :root{color-scheme:light dark}.bg{fill:#fff}.panel{fill:#fff7ed;stroke:#e87524;stroke-width:3}.module{fill:#f6f8fa;stroke:#59636e;stroke-width:2}.pending{fill:#fff4d6;stroke:#b7791f;stroke-width:2;stroke-dasharray:9 7}.wire{stroke:#334155;stroke-width:3;fill:none}.radio{stroke:#e87524;stroke-width:4;stroke-dasharray:10 8;fill:none}.label{font:600 23px ui-sans-serif,system-ui,sans-serif;fill:#18202a}.small{font:17px ui-sans-serif,system-ui,sans-serif;fill:#334155}.note{font:600 17px ui-sans-serif,system-ui,sans-serif;fill:#9a3412}
    @media(prefers-color-scheme:dark){.bg{fill:#0d1117}.panel{fill:#21170f;stroke:#ff8a3d}.module{fill:#161b22;stroke:#8b949e}.pending{fill:#2a2112;stroke:#d29922}.wire{stroke:#c9d1d9}.radio{stroke:#ff8a3d}.label{fill:#f0f6fc}.small{fill:#c9d1d9}.note{fill:#ffa657}}
  </style>
  <rect class="bg" width="1280" height="820"/><text class="label" x="45" y="50">接线边界图 / Wiring overview</text><text class="small" x="45" y="80">按当前源码整理；不是 PCB 原理图；当前提交未做端到端真机复测</text>
  <rect class="panel" x="420" y="130" width="320" height="430" rx="24"/><text class="label" x="500" y="174">ESP32 标签</text><text class="small" x="465" y="220">SPI · GPIO5/4/26 · SX1278</text><text class="small" x="465" y="260">I²C · GPIO21/22</text><text class="small" x="465" y="300">GPIO33 · MPU6050 INT</text><text class="small" x="465" y="340">GPIO13 · Hall wake</text><text class="small" x="465" y="380">GPIO15 · DHT11</text><text class="small" x="465" y="420">GPIO16/17 · JQ6500</text><text class="small" x="465" y="460">I²C 0x3C · SSD1306</text><text class="small" x="465" y="510">Wake: timer / GPIO33 / GPIO13</text>
  <rect class="module" x="50" y="130" width="275" height="86" rx="14"/><text class="label" x="86" y="165">MPU6050 + OLED</text><text class="small" x="86" y="193">SDA21 · SCL22 · INT33</text><path class="wire" d="M325 173 H420"/>
  <rect class="module" x="50" y="250" width="275" height="86" rx="14"/><text class="label" x="86" y="285">DHT11 + Hall</text><text class="small" x="86" y="313">DATA15 · Hall13</text><path class="wire" d="M325 293 H420"/>
  <rect class="pending" x="50" y="370" width="275" height="105" rx="14"/><text class="label" x="86" y="405">JQ6500 + speaker</text><text class="small" x="86" y="433">RX16 · TX17</text><text class="small" x="86" y="458">audio/power pending</text><path class="wire" d="M325 422 H420"/>
  <rect class="pending" x="50" y="510" width="275" height="105" rx="14"/><text class="label" x="86" y="545">Battery / regulator</text><text class="small" x="86" y="573">circuit pending</text><text class="small" x="86" y="598">battery reading: N/A</text><path class="wire" d="M325 562 H420"/>
  <rect class="module" x="840" y="130" width="350" height="170" rx="18"/><text class="label" x="925" y="170">ESP32 网关</text><text class="small" x="885" y="215">SPI · GPIO5/4/26 · SX1278</text><text class="small" x="885" y="250">Wi-Fi HTTP → Flask</text><path class="radio" d="M740 215 H840"/><text class="small" x="755" y="200">LoRa 433 MHz</text>
  <rect class="module" x="840" y="350" width="350" height="105" rx="18"/><text class="label" x="920" y="390">Flask + SQLite</text><text class="small" x="885" y="425">trusted LAN only · no auth/TLS</text><path class="wire" d="M1015 300 V350"/>
  <rect class="module" x="840" y="505" width="350" height="105" rx="18"/><text class="label" x="925" y="545">Android App</text><text class="small" x="885" y="580">minSdk 23 · local HTTP / HTTPS</text><path class="wire" d="M1015 455 V505"/>
  <text class="note" x="45" y="690">QUERY / PLAY_VOICE 只能在标签清醒窗口接收；LoRa DIO0 不是当前深睡唤醒源。</text><text class="small" x="45" y="730">Dashed modules require physical confirmation. Use matched antennas and comply with local radio regulations.</text><text class="small" x="45" y="765">HTTP 200 only confirms command dispatch to the gateway; it does not confirm delivery to or playback by the tag.</text>
</svg>
