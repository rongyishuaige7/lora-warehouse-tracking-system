name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lora-warehouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-and-firmware:
    name: Repository, server and ESP32 firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned PlatformIO and server dependencies
        run: |
          python -m pip install --require-hashes -r .github/platformio-requirements.txt
          python -m pip install -r server/requirements.txt -r server/requirements-dev.txt
      - name: Run repository and secret gates
        run: |
          python scripts/secret_scan.py
          python scripts/check_repo.py
      - name: Prepare example local configuration
        run: |
          cp esp32_tag/config.example.h esp32_tag/config.h
          cp esp32_gateway/config.example.h esp32_gateway/config.h
      - name: Check and test Python server
        run: |
          python -m py_compile server/*.py server/tests/*.py
          cd server && python -m pytest tests -q
      - name: Build tag and gateway firmware
        run: |
          pio run -e tag
          pio run -e gateway
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lora-warehouse-firmware-${{ github.sha }}
          path: |
            .pio/build/tag/firmware.bin
            .pio/build/tag/firmware.elf
            .pio/build/gateway/firmware.bin
            .pio/build/gateway/firmware.elf
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android unit test and Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
      - name: Test and build Debug APK
        working-directory: android_app
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Upload Debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lora-warehouse-android-debug-${{ github.sha }}
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
