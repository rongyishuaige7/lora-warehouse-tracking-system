[platformio]
default_envs = tag, gateway
src_dir = firmware

[env]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  sandeepmistry/LoRa@0.8.0
  adafruit/DHT sensor library@1.4.6
  electroniccats/MPU6050@1.4.4
  adafruit/Adafruit SSD1306@2.5.16
  adafruit/Adafruit GFX Library@1.12.5
  adafruit/Adafruit BusIO@1.17.4
  https://github.com/sleemanj/JQ6500_Serial.git#7a5f53f54a9e66579582e12d1d0495572220e877
  bblanchon/ArduinoJson@7.4.3

[env:tag]
build_src_filter =
  +<tag.cpp>
  -<gateway.cpp>

[env:gateway]
build_src_filter =
  +<gateway.cpp>
  -<tag.cpp>
